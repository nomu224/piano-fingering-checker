<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PWA アイコン(any/maskable 兼用)。背景を端まで塗り、主要素は中央のセーフゾーンに収める -->
  <rect width="512" height="512" fill="#2a2a3e"/>
  <!-- 鍵盤(白鍵) -->
  <rect x="136" y="176" width="240" height="200" rx="8" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <!-- 白鍵の境界 -->
  <g stroke="#bbb" stroke-width="2">
    <line x1="176" y1="176" x2="176" y2="376"/>
    <line x1="216" y1="176" x2="216" y2="376"/>
    <line x1="256" y1="176" x2="256" y2="376"/>
    <line x1="296" y1="176" x2="296" y2="376"/>
    <line x1="336" y1="176" x2="336" y2="376"/>
  </g>
  <!-- 黒鍵 -->
  <g fill="#222">
    <rect x="164" y="176" width="24" height="118"/>
    <rect x="204" y="176" width="24" height="118"/>
    <rect x="284" y="176" width="24" height="118"/>
    <rect x="324" y="176" width="24" height="118"/>
  </g>
  <!-- 指先(左手=水色 / 右手=オレンジ) -->
  <circle cx="196" cy="322" r="21" fill="#ff9100" stroke="#fff" stroke-width="3"/>
  <circle cx="256" cy="342" r="21" fill="#ff9100" stroke="#fff" stroke-width="3"/>
  <circle cx="316" cy="322" r="21" fill="#40c4ff" stroke="#fff" stroke-width="3"/>
</svg>
